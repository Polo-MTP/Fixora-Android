# Entorno de producción (flavor prod). Se sube a Git: no pongas secretos aquí.
# Toda llave declarada aquí debe existir también en dev.properties.

# API de Fixora (Express), con /api/ al final.
API_URL=https://apifixora.sandialab.online/api/

# Portal web de Fixora (Angular). PROVIDER_SIGNUP_URL abre el registro de proveedores
# («Únete como proveedor» en la landing); PROVIDER_PORTAL_URL, el login del portal (proveedor en
# revisión que debe corregir documentos).
PROVIDER_SIGNUP_URL=https://fixora.sandialab.online/registro-proveedor
PROVIDER_PORTAL_URL=https://fixora.sandialab.online/login

# Firebase Cloud Messaging (ANDROID-6). Se copian de google-services.json de la app de este flavor
# en la consola de Firebase (dev usa el paquete com.fixora.app.dev): mobilesdk_app_id, current_key,
# project_id y project_number. No son secretos, pero puedes ponerlos solo en local.properties
# (dev.FIREBASE_APP_ID=...). Vacíos, la app funciona sin notificaciones push.
FIREBASE_APP_ID=
FIREBASE_API_KEY=
FIREBASE_PROJECT_ID=
FIREBASE_SENDER_ID=

# Estilo del mapa (ANDROID-10): MapLibre con los mapas gratuitos de OpenFreeMap, no pide llave.
MAP_STYLE_URL=https://tiles.openfreemap.org/styles/liberty
