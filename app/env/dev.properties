# Entorno de desarrollo (flavor dev). Se sube a Git: no pongas secretos aquí.
# 10.0.2.2 es el localhost de tu PC visto desde el emulador. En un celular físico,
# sobrescribe el valor en local.properties con la IP de tu PC, por ejemplo:
#   dev.API_URL=http://192.168.1.50:3001/api/
# Toda llave declarada aquí debe existir también en prod.properties.

# API de Fixora (Express). Termina en / porque Retrofit arma las rutas a partir de aquí.
API_URL=http://10.0.2.2:3001/api/

# Portal web donde se registran los proveedores (Angular).
# Temporal: YouTube, hasta que exista la página de registro del portal.
PROVIDER_SIGNUP_URL=https://www.youtube.com/
